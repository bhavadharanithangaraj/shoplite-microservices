spring.application.name=order-service
server.port=${PORT:8081}

# order-service has its OWN database (order_db). It never reads inventory_db directly -
# it asks inventory-service over HTTP instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/order_db}
spring.datasource.username=${DB_USERNAME:shoplite}
spring.datasource.password=${DB_PASSWORD:shoplite}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Where inventory-service lives. In Docker this becomes http://inventory-service:8082
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

# Don't wait forever if inventory-service is slow or down (milliseconds)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

springdoc.swagger-ui.path=/swagger-ui.html

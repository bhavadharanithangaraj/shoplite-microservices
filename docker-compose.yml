# Start everything:  docker compose up --build
#   order-service      http://localhost:8081  (Swagger: /swagger-ui.html)
#   inventory-service  http://localhost:8082  (Swagger: /swagger-ui.html)

services:
  # One Postgres server, two separate databases: inventory_db and order_db (see docker/postgres/init.sql)
  postgres:
    image: postgres:16-alpine
    container_name: shoplite-postgres
    environment:
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD: shoplite
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432" # 5433 on your machine, so it doesn't clash with another local Postgres
    volumes:
      - shoplite-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplite -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: shoplite
      DB_PASSWORD: shoplite
    ports:
      - "8082:8082"

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: shoplite
      DB_PASSWORD: shoplite
      # Inside Docker, services find each other by their service name
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    ports:
      - "8081:8081"

volumes:
  shoplite-pgdata:

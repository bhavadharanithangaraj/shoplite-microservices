spring.application.name=inventory-service
server.port=${PORT:8082}

# inventory-service has its OWN database (inventory_db). Defaults are for running locally;
# docker-compose overrides DB_URL so it points at the "postgres" container.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/inventory_db}
spring.datasource.username=${DB_USERNAME:shoplite}
spring.datasource.password=${DB_PASSWORD:shoplite}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
